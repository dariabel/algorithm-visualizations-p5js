<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithm Visualizations with p5.js</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <main class="container">
        <h1>Algorithm Visualizations</h1>
        <p class="subtitle">Interactive visualizations of classic algorithms using p5.js.</p>

        <section class="control-panel" aria-label="Visualization controls">
            <div class="algorithm-control">
                <label for="algorithm-select">Algorithm</label>
                <select id="algorithm-select">
                    <option value="bubble">Bubble Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="binary">Binary Search</option>
                </select>
            </div>

            <div id="search-control" class="search-control hidden">
                <label for="search-target">Target</label>
                <input id="search-target" type="number" />
            </div>

            <div class="controls">
                <button id="generate-btn">Generate New Array</button>
                <button id="start-btn">Start</button>
                <button id="pause-btn" disabled>Pause</button>
                <button id="reset-btn">Reset</button>
            </div>

            <div class="speed-control">
                <label for="speed-slider">Animation speed</label>
                <input id="speed-slider" type="range" min="1" max="30" value="15" />
                <span id="speed-value">15</span>
            </div>
        </section>

        <section class="statistics" aria-label="Sorting statistics">
            <div class="stat-card"><span class="stat-label">Comparisons</span><strong id="comparisons-value">0</strong></div>
            <div class="stat-card"><span class="stat-label">Swaps</span><strong id="swaps-value">0</strong></div>
            <div class="stat-card"><span class="stat-label">Progress</span><strong id="progress-value">0%</strong></div>
        </section>

        <p id="status-text" class="status" aria-live="polite">Ready</p>
        <div id="canvas-wrapper"></div>

        <section class="legend" aria-label="Colour legend">
            <span><i class="legend-box unsorted"></i>Unsorted</span>
            <span><i class="legend-box comparing"></i>Comparing</span>
            <span><i class="legend-box swapping"></i>Swapping</span>
            <span><i class="legend-box sorted"></i>Sorted</span>
        </section>
    </main>

    <script src="src/array.js"></script>
    <script src="src/algorithms.js"></script>
    <script src="src/renderer.js"></script>
    <script src="src/sketch.js"></script>
</body>
</html>
